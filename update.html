<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADB DevTools 更新日志</title><style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#29415f;background:#f5f8fd}*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:32px 22px}.back{color:#2879dc;text-decoration:none;font-size:14px}.card{margin-top:18px;padding:32px;background:#fff;border:1px solid #e1eaf6;border-radius:18px;box-shadow:0 8px 24px rgba(48,94,157,.07)}h1{margin:0;color:#193d73}h2{font-size:16px;color:#2e537f;margin:24px 0 8px}p,li{color:#6d809d;line-height:1.7}ul{padding-left:20px}.meta{margin-top:8px;color:#7c8da5;font-size:13px}.button{display:inline-block;margin-top:22px;padding:11px 17px;border-radius:9px;background:#237bed;color:white;text-decoration:none;font-weight:600}.disabled{opacity:.45;pointer-events:none}
</style></head><body><main class="wrap"><a class="back" href="index.html">← 返回下载页</a><article class="card"><h1 id="title">ADB DevTools v0.9.0</h1><p class="meta" id="release-date">2026-08-30</p><h2>新增</h2><ul id="added"><li>Android 设备开发与排障工作台首版。</li></ul><h2>优化</h2><ul id="optimized"><li>设备、应用、文件和诊断工作流。</li></ul><h2>修复</h2><ul id="fixed"><li>投屏、布局检查与大量应用加载稳定性。</li></ul><a id="download" class="button disabled">下载 Windows 版</a></article></main><script>fetch('./update/latest.json').then(r=>r.ok?r.json():null).then(m=>{if(!m)return;document.getElementById('title').textContent=m.title||`ADB DevTools v${m.version}`;document.getElementById('release-date').textContent=m.releaseDate||'';const notes=Array.isArray(m.notes)?m.notes:[];if(notes.length){for(const id of ['added','optimized','fixed'])document.getElementById(id).innerHTML=notes.map(n=>`<li>${String(n)}</li>`).join('')}if(/^https:\/\//i.test(m.downloadUrl)){const a=document.getElementById('download');a.href=m.downloadUrl;a.classList.remove('disabled')}})</script></body></html>
